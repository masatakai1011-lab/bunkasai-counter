<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>受け渡し口｜クレープ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="受け渡し">
<meta name="theme-color" content="#dde3ea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=DotGothic16&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="strip">
    <div class="sum">
      <span class="role">受け渡し口</span>
      <span class="sum-label">受け取り待ち</span><span class="sum-num" id="total" aria-live="polite">0</span><span class="sum-unit">個</span>
    </div>
    <div class="side">
      <span class="sub" id="handed">今日渡した <b>0</b> 個</span>
      <span class="conn off" id="conn">つないでいます…</span>
    </div>
  </div>
  <div class="cols">
    <section class="col choco" aria-label="チョコ">
      <div class="board">
        <div class="board-head">
          <span class="board-name">チョコ</span>
          <span class="board-count" id="wait-choco">待ち <b>0</b> 個</span>
        </div>
        <div class="rail" aria-hidden="true"></div>
        <div class="tickets" id="tickets-choco"></div>
        <button class="give" id="give-choco" type="button" data-item="choco">待っている券はありません</button>
      </div>
      <button class="undo" id="undo-choco" type="button" data-item="choco">戻せる券はありません</button>
    </section>
    <section class="col anko" aria-label="あんこ">
      <div class="board">
        <div class="board-head">
          <span class="board-name">あんこ</span>
          <span class="board-count" id="wait-anko">待ち <b>0</b> 個</span>
        </div>
        <div class="rail" aria-hidden="true"></div>
        <div class="tickets" id="tickets-anko"></div>
        <button class="give" id="give-anko" type="button" data-item="anko">待っている券はありません</button>
      </div>
      <button class="undo" id="undo-anko" type="button" data-item="anko">戻せる券はありません</button>
    </section>
  </div>
</div>

<script src="vendor/firebase-app-compat-10.12.2.js"></script>
<script src="vendor/firebase-database-compat-10.12.2.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var C = window.Crepe, $ = C.$;
  var SHOW = 4; // tickets clipped to the rail; the rest show as "+N"
  var last = null, enter = 0;

  function render(s) {
    C.ITEMS.forEach(function (k) {
      var name = C.NAMES[k], o = s.ordered[k], h = s.handed[k], w = s.waiting[k];
      var box = $("tickets-" + k), give = $("give-" + k), undo = $("undo-" + k);
      var arrived = last && o > last.ordered[k], gone = last && h > last.handed[k];
      if (arrived) enter++;
      // Waiting tickets: the ones after the last handed over, up to the last ordered; the oldest is next
      var html = "";
      for (var n = h + 1; n <= o && n <= h + SHOW; n++) {
        var cls = "tk" + (n === h + 1 ? " next" : "") + (arrived && n > last.ordered[k] ? (enter % 2 ? " inA" : " inB") : "");
        html += '<span class="' + cls + '"><span class="flavor">' + name + '</span><span class="no">No.</span><b>' + C.ticketNo(n) + "</b></span>";
      }
      if (w > SHOW) html += '<span class="more">+' + (w - SHOW) + "</span>";
      if (w === 0) html = '<span class="none">待っている券はありません</span>';
      box.innerHTML = html;
      if (gone) C.replay(box, "swingA", "swingB");

      $("wait-" + k).querySelector("b").textContent = w;
      $("wait-" + k).classList.toggle("alert", w > 0);
      give.disabled = w === 0;
      give.textContent = w ? "No." + C.ticketNo(h + 1) + " を渡した" : "待っている券はありません";
      undo.disabled = h === 0;
      undo.textContent = h ? "No." + C.ticketNo(h) + " を待ちに戻す" : "戻せる券はありません";
    });
    $("total").textContent = s.waiting.total;
    $("total").classList.toggle("alert", s.waiting.total > 0);
    $("handed").querySelector("b").textContent = s.handed.total;
    last = s;
  }

  document.querySelectorAll(".give").forEach(function (btn) {
    btn.addEventListener("click", function () { C.change("handed", btn.dataset.item, 1); });
  });
  document.querySelectorAll(".undo").forEach(function (btn) {
    btn.addEventListener("click", function () { C.change("handed", btn.dataset.item, -1); });
  });

  C.common();
  C.start(render, C.renderConnection);
})();
</script>
</body>
</html>
