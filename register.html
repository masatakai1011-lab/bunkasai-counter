<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>レジ｜クレープ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="レジ">
<meta name="theme-color" content="#dde3ea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=DotGothic16&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="strip">
    <div class="sum">
      <span class="role">レジ</span>
      <span class="sum-label">今日の売上</span><span class="sum-num" id="total">0</span><span class="sum-unit">個</span>
      <span class="sum-split" id="split">チョコ 0　あんこ 0</span>
    </div>
    <div class="side">
      <span class="sub" id="waiting">受け取り待ち <b>0</b> 個</span>
      <span class="conn off" id="conn">つないでいます…</span>
      <button class="reset" id="reset" type="button">今日の数をリセット</button>
    </div>
  </div>
  <div class="cols">
    <section class="col choco" aria-label="チョコ">
      <button class="machine" id="tap-choco" type="button" data-item="choco">
        <span class="machine-name">チョコ</span>
        <span class="machine-hint">注文を受けたら押す</span>
        <span class="machine-count">売上 <b id="count-choco">0</b> 個</span>
        <span class="slot" aria-hidden="true"></span>
      </button>
      <div class="ticket ticket-new" id="new-choco" aria-live="polite"></div>
      <div class="ticket ticket-old" id="old-choco" aria-hidden="true"></div>
      <button class="undo" id="undo-choco" type="button" data-item="choco">取り消せる券はありません</button>
    </section>
    <section class="col anko" aria-label="あんこ">
      <button class="machine" id="tap-anko" type="button" data-item="anko">
        <span class="machine-name">あんこ</span>
        <span class="machine-hint">注文を受けたら押す</span>
        <span class="machine-count">売上 <b id="count-anko">0</b> 個</span>
        <span class="slot" aria-hidden="true"></span>
      </button>
      <div class="ticket ticket-new" id="new-anko" aria-live="polite"></div>
      <div class="ticket ticket-old" id="old-anko" aria-hidden="true"></div>
      <button class="undo" id="undo-anko" type="button" data-item="anko">取り消せる券はありません</button>
    </section>
  </div>
</div>

<script src="vendor/firebase-app-compat-10.12.2.js"></script>
<script src="vendor/firebase-database-compat-10.12.2.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var C = window.Crepe, $ = C.$;
  var last = null;

  function render(s) {
    C.ITEMS.forEach(function (k) {
      var n = s.ordered[k], name = C.NAMES[k], fresh = $("new-" + k), old = $("old-" + k), undo = $("undo-" + k);
      $("count-" + k).textContent = n;
      $("tap-" + k).setAttribute("aria-label", name + "の注文を1個受けて券を出す（次は No." + C.ticketNo(n + 1) + "）");
      if (n > 0) {
        fresh.classList.remove("ticket-empty");
        fresh.innerHTML = "<span>" + name + "</span><span class=\"no\">No." + C.ticketNo(n) + "</span>";
      } else {
        fresh.classList.add("ticket-empty");
        fresh.textContent = "最初の券は No." + C.ticketNo(1);
      }
      old.hidden = n < 2;
      old.innerHTML = "<span>" + name + "</span><span class=\"no\">No." + C.ticketNo(n - 1) + "</span>";
      // Only an order that has not been handed over yet can be cancelled
      undo.disabled = s.waiting[k] === 0;
      undo.textContent = s.waiting[k] ? "No." + C.ticketNo(n) + " を取り消す" : "取り消せる券はありません";
      if (last && n > last.ordered[k]) C.replay(fresh, "outA", "outB");
    });
    $("total").textContent = s.ordered.total;
    $("split").textContent = "チョコ " + s.ordered.choco + "　あんこ " + s.ordered.anko;
    $("waiting").querySelector("b").textContent = s.waiting.total;
    $("waiting").classList.toggle("alert", s.waiting.total > 0);
    last = s;
  }

  document.querySelectorAll(".machine").forEach(function (btn) {
    btn.addEventListener("click", function () { C.change("ordered", btn.dataset.item, 1); });
  });
  document.querySelectorAll(".undo").forEach(function (btn) {
    btn.addEventListener("click", function () { C.change("ordered", btn.dataset.item, -1); });
  });
  C.twoTapButton($("reset"), "もう一度押すと 2台とも0に（券は201から）", C.resetToday);

  C.common();
  C.start(render, C.renderConnection);
})();
</script>
</body>
</html>
