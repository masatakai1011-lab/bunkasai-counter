<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>レジ｜クレープ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="レジ">
<meta name="theme-color" content="#eef1f5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="strip">
    <div class="sum">
      <span class="role">レジ</span>
      <div class="sum-main"><span class="sum-label">今日の売上</span><span class="sum-num" id="total">0</span><span class="sum-unit">個</span></div>
      <span class="sum-split" id="split">チョコ 0 ／ あんこ 0</span>
      <span class="sub" id="waiting">受け取り待ち <b>0</b> 個</span>
    </div>
    <div class="strip-right">
      <span class="conn off" id="conn">つないでいます…</span>
      <button class="reset" id="reset" type="button">今日の数をリセット</button>
    </div>
  </div>
  <div class="stalls">
    <section class="stall choco" data-item="choco">
      <button class="tap" id="tap-choco" type="button" data-item="choco" aria-describedby="count-choco">
        <span class="noren" aria-hidden="true"><span class="flaps"><span class="flap">チ</span><span class="flap">ョ</span><span class="flap">コ</span></span></span>
        <span class="panel-label" aria-hidden="true">今日の売上</span>
        <span class="sr">チョコの注文を1個受けた</span>
        <span class="count-wrap"><span class="count" id="count-choco">0</span><span class="unit">個</span></span>
        <span class="tally" id="tally-choco" aria-hidden="true"></span>
        <span class="hint" aria-hidden="true">注文を受けたら ここをタップ</span>
      </button>
      <button class="minus" id="minus-choco" type="button" data-item="choco">チョコの注文を1個取り消す</button>
    </section>
    <section class="stall anko" data-item="anko">
      <button class="tap" id="tap-anko" type="button" data-item="anko" aria-describedby="count-anko">
        <span class="noren" aria-hidden="true"><span class="flaps"><span class="flap">あ</span><span class="flap">ん</span><span class="flap">こ</span></span></span>
        <span class="panel-label" aria-hidden="true">今日の売上</span>
        <span class="sr">あんこの注文を1個受けた</span>
        <span class="count-wrap"><span class="count" id="count-anko">0</span><span class="unit">個</span></span>
        <span class="tally" id="tally-anko" aria-hidden="true"></span>
        <span class="hint" aria-hidden="true">注文を受けたら ここをタップ</span>
      </button>
      <button class="minus" id="minus-anko" type="button" data-item="anko">あんこの注文を1個取り消す</button>
    </section>
  </div>
</div>

<script async src="vendor/confetti-4.4.0.min.js"></script>
<script src="vendor/firebase-app-compat-10.12.2.js"></script>
<script src="vendor/firebase-database-compat-10.12.2.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var C = window.Crepe, $ = C.$;
  var MILESTONES = [50, 100, 200, 300, 500];
  var last = null;

  function celebrate(total) {
    C.animate($("total"), [{ transform: "scale(1)" }, { transform: "scale(1.35)" }, { transform: "scale(1)" }],
      { duration: 600, easing: "cubic-bezier(.3,1.6,.5,1)" });
    if (typeof window.confetti !== "function") return;
    var colors = ["#4b2a1d", "#e9c9a8", "#5e1f35", "#f1b9c8", "#fbf7f2"];
    try {
      Promise.resolve(window.confetti({ count: 90, spread: 70, angle: 60, position: { x: 0, y: 80 }, colors: colors, zIndex: 50 })).catch(function () {});
      Promise.resolve(window.confetti({ count: 90, spread: 70, angle: 120, position: { x: 100, y: 80 }, colors: colors, zIndex: 50 })).catch(function () {});
    } catch (e) { /* confetti is a bonus */ }
  }

  function render(s) {
    C.ITEMS.forEach(function (k) {
      var dir = last ? s.ordered[k] - last.ordered[k] : 0;
      C.setCount($("count-" + k), s.ordered[k], dir);
      C.renderTally($("tally-" + k), s.ordered[k], dir > 0, "まだ売れていません");
      // An order already handed over cannot be cancelled
      $("minus-" + k).disabled = s.waiting[k] === 0;
    });
    $("total").textContent = s.ordered.total;
    $("split").textContent = "チョコ " + s.ordered.choco + " ／ あんこ " + s.ordered.anko;
    $("waiting").querySelector("b").textContent = s.waiting.total;
    $("waiting").classList.toggle("busy", s.waiting.total > 0);
    if (last && s.ordered.total > last.ordered.total && MILESTONES.indexOf(s.ordered.total) !== -1) celebrate(s.ordered.total);
    last = s;
  }

  document.querySelectorAll(".tap").forEach(function (btn) {
    btn.addEventListener("click", function (ev) {
      C.change("ordered", btn.dataset.item, 1);
      C.swayNoren(btn.dataset.item);
      C.floatText(btn, ev, "+1");
    });
  });
  document.querySelectorAll(".minus").forEach(function (btn) {
    btn.addEventListener("click", function () { C.change("ordered", btn.dataset.item, -1); });
  });
  C.twoTapButton($("reset"), "もう一度押すと 今日の数が 0 に（2台とも）", C.resetToday);

  C.common();
  C.start(render, C.renderConnection);
})();
</script>
</body>
</html>
