<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>クレープ注文</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="クレープ">
<meta name="theme-color" content="#dde3ea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=DotGothic16&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.choose { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 3vw, 36px); }
@media (max-width: 640px) { .choose { grid-template-columns: 1fr; } }
.choose a {
  border-radius: 22px; text-decoration: none; color: var(--ink); background: var(--panel); box-shadow: 0 6px 0 var(--shade);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px 20px; text-align: center;
}
.choose a:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--shade); }
.choose b { font-weight: 700; font-size: clamp(2.4rem, 6vw, 3.6rem); letter-spacing: .1em; }
.choose span { font-size: 1.1rem; color: var(--ink-2); line-height: 1.6; }
h1.top { font-weight: 700; font-size: 1.6rem; margin: 0; }
</style>
</head>
<body>

<div class="app">
  <h1 class="top">このiPadはどこで使いますか？</h1>
  <div class="choose">
    <a href="register.html"><b>レジ</b><span>注文を受けたら券を出す<br>今日の売上を見る</span></a>
    <a href="pass.html"><b>受け渡し口</b><span>待っている券を見る<br>渡したら押す</span></a>
  </div>
</div>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
