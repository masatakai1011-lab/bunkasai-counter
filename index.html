<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>クレープ注文</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="クレープ">
<meta name="theme-color" content="#eef1f5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<style>
.choose { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 600px) { .choose { grid-template-columns: 1fr; } }
.choose a {
  border-radius: 26px; text-decoration: none; color: var(--noren-ink); background: var(--choco);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 32px 20px; text-align: center;
}
.choose a.pass { background: var(--anko); }
.choose a:active { filter: brightness(1.1); }
.choose b { font-family: var(--body); font-weight: 900; font-size: clamp(2.4rem, 7vw, 4.4rem); line-height: 1.1; }
.choose span { font-weight: 700; font-size: 1.1rem; opacity: .85; }
.choose a:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }
h1.top { font-weight: 900; font-size: 1.8rem; margin: 0; }
</style>
</head>
<body>

<div class="app">
  <h1 class="top">このiPadはどこで使いますか？</h1>
  <div class="choose">
    <a class="reg" href="register.html"><b>レジ</b><span>注文を受けたらタップ<br>今日の売上を見る</span></a>
    <a class="pass" href="pass.html"><b>受け渡し口</b><span>渡したらタップ<br>受け取り待ちを見る</span></a>
  </div>
</div>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
