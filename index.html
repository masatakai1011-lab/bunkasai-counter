<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>チョコあんこカウンター</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="カウンター">
<meta name="theme-color" content="#eef1f5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
[hidden] { display: none !important; }
/* Layout: one screen. A slim tally strip on top, then two stall panels side by side
   (stacked on narrow screens). Each panel = a noren curtain with the item name,
   a giant count, a 正-mark tally of the same count, and a −1 button at its foot. */
:root {
  --paper: #eef1f5;
  --ink: #1d2340;
  --muted: #646b88;
  --line: #d3d8e3;
  --card: #ffffff;
  --choco: #4b2a1d;
  --choco-deep: #2f1810;
  --choco-mark: #e9c9a8;
  --anko: #5e1f35;
  --anko-deep: #3c1121;
  --anko-mark: #f1b9c8;
  --noren-ink: #fbf7f2;
  --warn: #c2271f;
  --wait: #ffd36b;
  --display: "Dela Gothic One", "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12152a; --ink: #eceef8; --muted: #9aa0bd; --line: #2b3050; --card: #1b1f39;
    --choco: #6a3d2a; --choco-deep: #3e2117; --anko: #7d2c48; --anko-deep: #4a1528;
    --warn: #ff8f86; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12152a; --ink: #eceef8; --muted: #9aa0bd; --line: #2b3050; --card: #1b1f39;
  --choco: #6a3d2a; --choco-deep: #3e2117; --anko: #7d2c48; --anko-deep: #4a1528;
  --warn: #ff8f86; color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body);
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; overflow: hidden;
}
.app {
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Top strip */
.strip { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sum { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.sum-main { display: flex; align-items: baseline; gap: 6px; }
.sum-label { font-weight: 700; font-size: 1rem; color: var(--muted); }
.sum-num { font-family: var(--display); font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.sum-unit { font-weight: 700; color: var(--muted); }
.sum-split { font-weight: 700; font-size: .95rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.next { font-weight: 700; font-size: .95rem; color: var(--muted); }
.reset {
  font: inherit; font-weight: 700; font-size: 1rem; min-height: 44px; padding: 0 20px; border-radius: 999px;
  border: 2px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer;
  transition: border-color .15s, color .15s, background .15s;
}
.reset.armed { border-color: var(--warn); color: var(--warn); }
.notice { margin: 0; font-size: .95rem; font-weight: 700; color: var(--warn); }

/* Stall panels */
.stalls { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 600px) {
  /* Phones: let the page scroll so each stacked panel keeps room for its number */
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .stalls { grid-template-columns: 1fr; flex: none; }
  .stall { min-height: 460px; }
  .tally { max-height: 56px; }
}
.stall {
  --c: var(--choco); --deep: var(--choco-deep); --mark: var(--choco-mark);
  position: relative; min-height: 0; display: flex; flex-direction: column;
  border-radius: 26px; overflow: hidden; background: var(--c); color: var(--noren-ink);
}
.stall.anko { --c: var(--anko); --deep: var(--anko-deep); --mark: var(--anko-mark); }
/* anko gets a faint bean-dot texture, choco a soft glaze sheen: the two fillings read apart at a glance */
.stall.choco { background: linear-gradient(160deg, color-mix(in srgb, var(--c) 82%, #fff 18%) 0%, var(--c) 38%, var(--c) 100%); }
.stall.anko {
  background-color: var(--c);
  background-image: radial-gradient(color-mix(in srgb, var(--deep) 70%, transparent) 2.2px, transparent 2.6px);
  background-size: 22px 22px;
}

.tap {
  flex: 1; min-height: 0; width: 100%; border: 0; padding: 0; margin: 0; cursor: pointer;
  background: transparent; color: inherit; font: inherit;
  display: flex; flex-direction: column; align-items: center; position: relative;
}
.tap .count-wrap { transition: transform .08s ease; }
.tap:active .count-wrap { transform: scale(.95); }
.stall:has(.tap:active) { filter: brightness(1.1); }
.tap:focus-visible { outline: 4px solid var(--noren-ink); outline-offset: -8px; border-radius: 26px; }

/* Noren: a curtain of three flaps hanging from a rod */
.noren { width: 100%; position: relative; padding-top: 10px; flex: none; }
.noren::before {
  content: ""; position: absolute; left: 6%; right: 6%; top: 4px; height: 8px; border-radius: 4px;
  background: var(--deep);
}
.flaps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 9%; }
.flap {
  height: clamp(64px, 12vh, 110px); background: var(--noren-ink); color: var(--c);
  border-radius: 0 0 10px 10px; transform-origin: 50% 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--display); font-size: clamp(2rem, 5.4vw, 3.6rem); line-height: 1;
}

.count-wrap {
  flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative; container-type: inline-size;
}
.count {
  font-family: var(--display); font-variant-numeric: tabular-nums; line-height: 1;
  font-size: min(12rem, 17vw, calc(78cqi / (var(--n, 1) * .8 + .6))); letter-spacing: -.02em; display: block;
}
.unit { font-weight: 900; font-size: clamp(1.1rem, 2.4vw, 1.6rem); margin-left: .25em; opacity: .8; }

/* 正-mark tally: five strokes per group, the way stall-keepers count on paper */
.tally {
  flex: none; width: 100%; box-sizing: border-box; padding: 0 20px 14px;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 8px;
  min-height: 44px; max-height: 92px; overflow: hidden;
}
.tally svg { width: 30px; height: 30px; flex: none; }
.tally path { stroke: var(--mark); stroke-width: 9; stroke-linecap: round; fill: none; }
.tally .more { font-weight: 900; color: var(--mark); font-size: 1rem; }
.tally .empty { font-weight: 700; font-size: 1rem; opacity: .7; }
.tally path.fresh { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw .28s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.minus {
  flex: none; margin: 0 14px 14px; min-height: 48px; border-radius: 16px; cursor: pointer;
  border: 2px solid color-mix(in srgb, var(--noren-ink) 35%, transparent);
  background: color-mix(in srgb, var(--deep) 75%, transparent); color: var(--noren-ink);
  font: inherit; font-weight: 700; font-size: 1.1rem;
}
.minus:disabled { opacity: .4; cursor: default; }

/* Orders waiting to be handed over: 注文 +1 adds one, tapping the panel (= handed over) takes one off */
.queue {
  flex: none; margin: 0 14px 10px; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: stretch;
}
.order {
  min-height: 64px; border-radius: 16px; cursor: pointer; border: 0;
  background: var(--noren-ink); color: var(--c); font: inherit; font-family: var(--display); font-size: 1.5rem;
}
.order:active { transform: scale(.97); }
.waiting {
  min-width: 7.5em; padding: 0 12px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--deep) 75%, transparent); border: 2px solid transparent;
  font-weight: 700; font-size: .9rem; line-height: 1.2;
}
.waiting b { font-family: var(--display); font-weight: 400; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.waiting.busy { border-color: var(--wait); color: var(--wait); }
.cancel {
  min-height: 64px; padding: 0 14px; border-radius: 16px; cursor: pointer;
  border: 2px solid color-mix(in srgb, var(--noren-ink) 35%, transparent);
  background: transparent; color: var(--noren-ink); font: inherit; font-weight: 700; font-size: .95rem;
}
.cancel:disabled { opacity: .4; cursor: default; }
.order:focus-visible, .cancel:focus-visible { outline: 3px solid var(--noren-ink); outline-offset: 3px; }
.sum-wait { font-weight: 700; font-size: 1.05rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sum-wait b { font-family: var(--display); font-weight: 400; font-size: 1.6rem; }
.sum-wait.busy { color: var(--warn); }
@media (max-width: 600px) { .waiting { min-width: 6em; } .cancel { padding: 0 10px; } }
.minus:focus-visible, .reset:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.stall .minus:focus-visible { outline-color: var(--noren-ink); }

/* "+1" that rises from the finger */
.float {
  position: absolute; pointer-events: none; font-family: var(--display); font-size: 2.4rem;
  color: var(--noren-ink); text-shadow: 0 2px 0 var(--deep); transform: translate(-50%, -50%);
}

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app { padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.install {
  margin: 0; padding: 12px 16px; border-radius: 14px; background: var(--card); border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; font-size: .95rem;
}
.install button {
  font: inherit; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--line);
  background: transparent; color: var(--muted); cursor: pointer; flex: none;
}
.ready { font-weight: 700; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>

<div class="app">
  <div class="strip">
    <div class="sum">
      <div class="sum-main"><span class="sum-label">合計</span><span class="sum-num" id="total">0</span><span class="sum-unit">個</span></div>
      <span class="sum-split" id="split">チョコ 0 ／ あんこ 0</span>
      <span class="next" id="next">あと100個で 100個達成</span>
      <span class="sum-wait" id="wait-total" aria-live="polite">作り待ち <b>0</b> 個</span>
    </div>
    <span class="ready" id="ready" hidden>ネットなしでも動きます</span>
    <button class="reset" id="reset" type="button">リセット</button>
  </div>
  <p class="install" id="install" hidden>
    <span>Safariの共有ボタン（□に↑）→「ホーム画面に追加」で、ネットなしでも使えるアプリになります。</span>
    <button type="button" id="install-close">閉じる</button>
  </p>
  <p class="notice" id="notice" hidden>この画面では数を保存できません。ページを閉じると数が消えます。</p>

  <div class="stalls">
    <section class="stall choco" data-item="choco">
      <button class="tap" id="tap-choco" type="button" data-item="choco" aria-describedby="count-choco">
        <span class="noren" aria-hidden="true"><span class="flaps"><span class="flap">チ</span><span class="flap">ョ</span><span class="flap">コ</span></span></span>
        <span class="sr">チョコを1個渡した（売上に1個追加）</span>
        <span class="count-wrap"><span class="count" id="count-choco">0</span><span class="unit">個</span></span>
        <span class="tally" id="tally-choco" aria-hidden="true"></span>
      </button>
      <div class="queue">
        <button class="order" id="order-choco" type="button" data-item="choco" aria-label="チョコの注文を1個受けた">注文 +1</button>
        <span class="waiting" id="waiting-choco"><span>作り待ち</span><span><b id="wait-choco">0</b> 個</span></span>
        <button class="cancel" id="cancel-choco" type="button" data-item="choco">注文 −1</button>
      </div>
      <button class="minus" id="minus-choco" type="button" data-item="choco">売上を1個減らす</button>
    </section>

    <section class="stall anko" data-item="anko">
      <button class="tap" id="tap-anko" type="button" data-item="anko" aria-describedby="count-anko">
        <span class="noren" aria-hidden="true"><span class="flaps"><span class="flap">あ</span><span class="flap">ん</span><span class="flap">こ</span></span></span>
        <span class="sr">あんこを1個渡した（売上に1個追加）</span>
        <span class="count-wrap"><span class="count" id="count-anko">0</span><span class="unit">個</span></span>
        <span class="tally" id="tally-anko" aria-hidden="true"></span>
      </button>
      <div class="queue">
        <button class="order" id="order-anko" type="button" data-item="anko" aria-label="あんこの注文を1個受けた">注文 +1</button>
        <span class="waiting" id="waiting-anko"><span>作り待ち</span><span><b id="wait-anko">0</b> 個</span></span>
        <button class="cancel" id="cancel-anko" type="button" data-item="anko">注文 −1</button>
      </div>
      <button class="minus" id="minus-anko" type="button" data-item="anko">売上を1個減らす</button>
    </section>
  </div>
</div>

<script async src="vendor/confetti-4.4.0.min.js"></script>
<script>
(function () {
  var KEY = "bunkasai-counter-v1";
  var MILESTONES = [100, 500, 1000];
  var MAX_GROUPS = 12;
  var NAMES = { choco: "チョコ", anko: "あんこ" };
  var counts = { choco: 0, anko: 0 };
  // Orders taken but not yet handed over
  var waiting = { choco: 0, anko: 0 };
  // For each recent sale: 1 if it used up a waiting order, 0 if not. Lets −1 on the sale put the order back.
  var MAX_HISTORY = 200;
  var fromOrder = { choco: [], anko: [] };
  var storageOk = true;
  var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  var raw = null, savedCelebrated = 0;
  try { raw = localStorage.getItem(KEY); } catch (e) { storageOk = false; }
  try {
    var saved = JSON.parse(raw || "null");
    if (saved) {
      counts.choco = Math.max(0, parseInt(saved.choco, 10) || 0);
      counts.anko = Math.max(0, parseInt(saved.anko, 10) || 0);
      savedCelebrated = Math.max(0, parseInt(saved.celebrated, 10) || 0);
      if (saved.waiting) {
        waiting.choco = Math.max(0, parseInt(saved.waiting.choco, 10) || 0);
        waiting.anko = Math.max(0, parseInt(saved.waiting.anko, 10) || 0);
      }
      if (saved.fromOrder) {
        ["choco", "anko"].forEach(function (k) {
          var h = saved.fromOrder[k];
          if (Array.isArray(h)) fromOrder[k] = h.slice(-MAX_HISTORY).map(function (v) { return v ? 1 : 0; });
        });
      }
    }
  } catch (e) { /* broken saved data: start from 0 */ }

  // iOS Safari only shows :active press feedback when a touch listener exists
  document.addEventListener("touchstart", function () {}, { passive: true });

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        choco: counts.choco, anko: counts.anko, celebrated: celebrated,
        waiting: waiting, fromOrder: fromOrder
      }));
      storageOk = true;
    }
    catch (e) { storageOk = false; }
    document.getElementById("notice").hidden = storageOk;
  }

  function $(id) { return document.getElementById(id); }
  function animate(el, frames, opts) {
    if (reduceMotion || !el.animate) return null;
    return el.animate(frames, opts);
  }

  // Stroke order of 正 in a 100×100 box: top bar, center post, right arm, left post, base
  var STROKES = [
    "M18 14 H82", "M50 14 V88", "M50 50 H76", "M26 46 V88", "M12 88 H88"
  ];
  function tallyGroup(n, freshIndex) {
    var paths = "";
    for (var i = 0; i < n; i++) {
      paths += '<path pathLength="100" d="' + STROKES[i] + '"' + (i === freshIndex ? ' class="fresh"' : "") + "></path>";
    }
    return '<svg viewBox="0 0 100 100">' + paths + "</svg>";
  }
  function renderTally(item, grew) {
    var n = counts[item], box = $("tally-" + item);
    if (n === 0) { box.innerHTML = '<span class="empty">タップすると 正 の字で数えます</span>'; return; }
    var full = Math.floor(n / 5), rest = n % 5;
    var groups = full + (rest ? 1 : 0);
    var shown = Math.min(groups, MAX_GROUPS);
    var html = groups > MAX_GROUPS ? '<span class="more">…</span>' : "";
    for (var g = groups - shown; g < groups; g++) {
      var size = (g < full) ? 5 : rest;
      var isLast = g === groups - 1;
      html += tallyGroup(size, grew && isLast ? size - 1 : -1);
    }
    box.innerHTML = html;
  }

  function renderWaiting(item, bump) {
    var n = waiting[item];
    $("wait-" + item).textContent = n;
    $("waiting-" + item).classList.toggle("busy", n > 0);
    $("cancel-" + item).disabled = n === 0;
    $("cancel-" + item).setAttribute("aria-label", NAMES[item] + "の注文を1個取り消す（作り待ち " + n + "個）");
    var all = waiting.choco + waiting.anko, top = $("wait-total");
    top.querySelector("b").textContent = all;
    top.classList.toggle("busy", all > 0);
    if (bump) {
      animate($("wait-" + item), [
        { transform: "scale(1)" }, { transform: "scale(1.3)" }, { transform: "scale(1)" }
      ], { duration: 260, easing: "ease-out" });
    }
  }

  function changeWaiting(item, delta) {
    var before = waiting[item];
    waiting[item] = Math.max(0, before + delta);
    if (waiting[item] === before) return;
    save();
    renderWaiting(item, true);
  }

  function renderSummary() {
    var total = counts.choco + counts.anko;
    $("total").textContent = total;
    $("split").textContent = "チョコ " + counts.choco + " ／ あんこ " + counts.anko;
    var goal = MILESTONES.filter(function (m) { return m > total; })[0];
    $("next").textContent = goal
      ? "あと" + (goal - total) + "個で " + goal + "個達成"
      : MILESTONES[MILESTONES.length - 1] + "個 達成ずみ";
  }

  function renderItem(item, dir) {
    var el = $("count-" + item);
    el.textContent = counts[item];
    el.style.setProperty("--n", String(counts[item]).length);
    $("minus-" + item).disabled = counts[item] === 0;
    $("minus-" + item).setAttribute("aria-label", NAMES[item] + "を1個減らす（今 " + counts[item] + "個）");
    if (dir) {
      // New number drops in from above when adding, rises from below when removing
      animate(el, [
        { transform: "translateY(" + (dir > 0 ? "-38%" : "38%") + ") scale(.9)", opacity: 0 },
        { transform: "translateY(0) scale(1.06)", opacity: 1, offset: .7 },
        { transform: "translateY(0) scale(1)", opacity: 1 }
      ], { duration: 260, easing: "cubic-bezier(.2,.8,.3,1)" });
    }
    renderTally(item, dir > 0);
  }

  function swayNoren(item) {
    var flaps = document.querySelectorAll('.stall[data-item="' + item + '"] .flap');
    flaps.forEach(function (f, i) {
      var amp = 7 - i * 1.5;
      animate(f, [
        { transform: "rotate(0deg)" },
        { transform: "rotate(" + amp + "deg)" },
        { transform: "rotate(" + (-amp * .55) + "deg)" },
        { transform: "rotate(" + (amp * .25) + "deg)" },
        { transform: "rotate(0deg)" }
      ], { duration: 620, delay: i * 40, easing: "ease-out" });
    });
  }

  function floatPlus(stall, x, y) {
    if (reduceMotion) return;
    var f = document.createElement("span");
    f.className = "float"; f.textContent = "+1";
    f.style.left = x + "px"; f.style.top = y + "px";
    stall.appendChild(f);
    var a = f.animate([
      { transform: "translate(-50%,-50%) scale(.6)", opacity: 0 },
      { transform: "translate(-50%,-90%) scale(1.1)", opacity: 1, offset: .25 },
      { transform: "translate(-50%,-220%) scale(1)", opacity: 0 }
    ], { duration: 700, easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards" });
    a.onfinish = function () { f.remove(); };
  }

  function celebrate(total) {
    var colors = ["#4b2a1d", "#e9c9a8", "#5e1f35", "#f1b9c8", "#fbf7f2"];
    animate($("total"), [
      { transform: "scale(1)" }, { transform: "scale(1.35)" }, { transform: "scale(1)" }
    ], { duration: 600, easing: "cubic-bezier(.3,1.6,.5,1)" });
    $("next").textContent = total + "個 達成！";
    if (typeof window.confetti !== "function" || reduceMotion) return;
    try {
      Promise.resolve(window.confetti({ count: 90, spread: 70, angle: 60, position: { x: 0, y: 80 }, colors: colors, zIndex: 50 }))
        .catch(function () {});
      Promise.resolve(window.confetti({ count: 90, spread: 70, angle: 120, position: { x: 100, y: 80 }, colors: colors, zIndex: 50 }))
        .catch(function () {});
    } catch (e) { /* confetti is a bonus; counting never depends on it */ }
  }

  function change(item, delta) {
    var before = counts[item];
    counts[item] = Math.max(0, before + delta);
    if (counts[item] === before) return false;
    var h = fromOrder[item];
    if (delta > 0) {
      // Handing one over finishes one waiting order, if there is one
      var used = waiting[item] > 0 ? 1 : 0;
      waiting[item] -= used;
      h.push(used);
      if (h.length > MAX_HISTORY) h.shift();
      renderWaiting(item, used === 1);
    } else if (h.pop() === 1) {
      // Undoing a sale that had finished an order puts that order back in the queue
      waiting[item] += 1;
      renderWaiting(item, true);
    }
    save();
    renderItem(item, delta);
    renderSummary();
    var total = counts.choco + counts.anko;
    // Celebrate each milestone once, even if a −1 then +1 crosses it again
    if (delta > 0 && MILESTONES.indexOf(total) !== -1 && total > celebrated) {
      celebrated = total;
      save();
      celebrate(total);
    }
    return true;
  }
  var celebrated = Math.max(savedCelebrated, MILESTONES.filter(function (m) { return m <= counts.choco + counts.anko; }).pop() || 0);

  document.querySelectorAll(".tap").forEach(function (btn) {
    btn.addEventListener("click", function (ev) {
      var item = btn.dataset.item;
      change(item, 1);
      swayNoren(item);
      var stall = btn.parentNode, r = stall.getBoundingClientRect();
      // Keyboard activation has no pointer position: rise from the number instead
      var x = ev.clientX ? ev.clientX - r.left : r.width / 2;
      var y = ev.clientY ? ev.clientY - r.top : r.height / 2;
      floatPlus(stall, x, y);
    });
  });
  document.querySelectorAll(".minus").forEach(function (btn) {
    btn.addEventListener("click", function () { change(btn.dataset.item, -1); });
  });

  document.querySelectorAll(".order").forEach(function (btn) {
    btn.addEventListener("click", function () { changeWaiting(btn.dataset.item, 1); });
  });
  document.querySelectorAll(".cancel").forEach(function (btn) {
    btn.addEventListener("click", function () { changeWaiting(btn.dataset.item, -1); });
  });

  // Reset needs a second tap within 3 seconds, since confirm() is not available here
  var resetBtn = $("reset"), armTimer = null;
  function disarm() {
    clearTimeout(armTimer); armTimer = null;
    resetBtn.classList.remove("armed"); resetBtn.textContent = "リセット";
  }
  resetBtn.addEventListener("click", function () {
    if (armTimer) {
      disarm();
      counts.choco = 0; counts.anko = 0; celebrated = 0;
      waiting.choco = 0; waiting.anko = 0; fromOrder.choco = []; fromOrder.anko = [];
      save(); renderItem("choco", 0); renderItem("anko", 0); renderSummary();
      renderWaiting("choco"); renderWaiting("anko");
    } else {
      resetBtn.classList.add("armed"); resetBtn.textContent = "もう一度押すと 0 に戻ります";
      armTimer = setTimeout(disarm, 3000);
    }
  });

  // Keep the iPad screen awake while the page is open, if allowed
  function keepAwake() {
    if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
    navigator.wakeLock.request("screen").catch(function () {});
  }
  document.addEventListener("visibilitychange", keepAwake);
  keepAwake();

  document.getElementById("notice").hidden = storageOk;
  renderItem("choco", 0); renderItem("anko", 0); renderSummary();
  renderWaiting("choco"); renderWaiting("anko");

  // Opening moment: the curtains drop onto their rods once, then stay still
  document.querySelectorAll(".flap").forEach(function (f, i) {
    animate(f, [
      { transform: "translateY(-110%)", opacity: 0 },
      { transform: "translateY(4%)", opacity: 1, offset: .7 },
      { transform: "translateY(0)", opacity: 1 }
    ], { duration: 520, delay: 80 + i * 60, easing: "cubic-bezier(.2,.8,.3,1)", fill: "backwards" });
  });
})();
</script>
<script>
(function () {
  // Install hint: shown in Safari until the app runs from the Home Screen
  var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  var dismissed = false;
  try { dismissed = localStorage.getItem("bunkasai-install-hint") === "closed"; } catch (e) {}
  var box = document.getElementById("install");
  box.hidden = standalone || dismissed;
  document.getElementById("install-close").addEventListener("click", function () {
    box.hidden = true;
    try { localStorage.setItem("bunkasai-install-hint", "closed"); } catch (e) {}
  });

  // Offline: the service worker keeps every file of the app on the iPad
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(function () {
      return navigator.serviceWorker.ready;
    }).then(function () {
      document.getElementById("ready").hidden = !standalone;
    }).catch(function () {});
  }
})();
</script>
